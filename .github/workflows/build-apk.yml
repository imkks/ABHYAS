name: Abhyas CI / CD

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-test:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Install Flutter dependencies
        working-directory: ./app
        run: flutter pub get

      # - name: Verify formatting & static analysis
      #   working-directory: ./app
      #   run: flutter analyze

      - name: Run unit & safety rule matrix tests
        working-directory: ./app
        run: flutter test --coverage

  flutter-build-apk:
    name: Build Release APK
    needs: flutter-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abhyas-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  console-check:
    name: Teacher Console Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./console
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        working-directory: ./console
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build web console
        working-directory: ./console
        run: npm run build

      - name: Upload console build artifact
        uses: actions/upload-artifact@v4
        with:
          name: abhyas-console-web
          path: console/build
          retention-days: 7

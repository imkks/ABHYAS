name: Release Android App Bundle & APK (Manual)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Version Code / Build Number (positive integer, e.g. 1)'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build Signed Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Validate release inputs & upload signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if ! [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid version_code '${{ inputs.version_code }}'. Must be a positive integer."
            exit 1
          fi
          if [ -z "${{ inputs.version_name }}" ]; then
            echo "::error::version_name must not be blank."
            exit 1
          fi

          missing_secrets=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing_secrets+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEY_ALIAS" ] && missing_secrets+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing_secrets+=("ANDROID_KEY_PASSWORD")
          [ -z "$ANDROID_STORE_PASSWORD" ] && missing_secrets+=("ANDROID_STORE_PASSWORD")

          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing_secrets[*]}"
            echo "Please configure these secrets in GitHub Repo -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/abhyas-upload.jks"
          chmod 600 "$RUNNER_TEMP/abhyas-upload.jks"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run unit tests before release packaging
        working-directory: ./android
        run: ./gradlew :engine:test :app:testDebugUnitTest --no-daemon

      - name: Build signed Release AAB & Release APK
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/abhyas-upload.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}"

      - name: Verify signed AAB & APK signatures
        run: |
          bundle_path="android/app/build/outputs/bundle/release/app-release.aab"
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$bundle_path" || { echo "::error::Bundle not found at $bundle_path"; exit 1; }
          test -f "$apk_path" || { echo "::error::Release APK not found at $apk_path"; exit 1; }

          jarsigner -verify -verbose "$bundle_path"
          echo "AAB bundle signature verified."

          apksigner_bin=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$apksigner_bin" ]; then
            "$apksigner_bin" verify --verbose "$apk_path"
          else
            jarsigner -verify -verbose "$apk_path"
          fi
          echo "Release APK signature verified."

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          VERSION_TAG="v${{ inputs.version_name }}+${{ inputs.version_code }}"
          BUNDLE_NAME="pranaflow-${VERSION_TAG}.aab"
          APK_NAME="pranaflow-${VERSION_TAG}-release.apk"

          cp android/app/build/outputs/bundle/release/app-release.aab "dist/${BUNDLE_NAME}"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"

          cd dist
          sha256sum "${BUNDLE_NAME}" > "${BUNDLE_NAME}.sha256"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"

          echo "STAGED_BUNDLE=${BUNDLE_NAME}" >> "$GITHUB_ENV"
          echo "STAGED_APK=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pranaflow-v${{ inputs.version_name }}+${{ inputs.version_code }}-release
          path: |
            dist/${{ env.STAGED_BUNDLE }}
            dist/${{ env.STAGED_BUNDLE }}.sha256
            dist/${{ env.STAGED_APK }}
            dist/${{ env.STAGED_APK }}.sha256
          retention-days: 90

      - name: Clean temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/abhyas-upload.jks"

      - name: GitHub Action Job Summary
        run: |
          BUNDLE_FILE="dist/${{ env.STAGED_BUNDLE }}"
          APK_FILE="dist/${{ env.STAGED_APK }}"
          BUNDLE_SIZE=$(ls -lh "$BUNDLE_FILE" | awk '{print $5}')
          APK_SIZE=$(ls -lh "$APK_FILE" | awk '{print $5}')
          BUNDLE_SHA=$(awk '{print $1}' "${BUNDLE_FILE}.sha256")
          APK_SHA=$(awk '{print $1}' "${APK_FILE}.sha256")

          echo "### PranaFlow Android Native Release Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Version | Size | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.STAGED_BUNDLE }}\` (Play Console) | \`${{ inputs.version_name }}\` (\`${{ inputs.version_code }}\`) | \`${BUNDLE_SIZE}\` | \`${BUNDLE_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.STAGED_APK }}\` (Direct Install) | \`${{ inputs.version_name }}\` (\`${{ inputs.version_code }}\`) | \`${APK_SIZE}\` | \`${APK_SHA}\` |" >> $GITHUB_STEP_SUMMARY
